<script>

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)], id=()=>Math.random().toString(36).slice(2,10), now=()=>new Date().toISOString();
const state={tab:'overview',projectId:'',clipId:'',shotId:'',charId:'',locId:'',prompt:'',projects:[],saveTimer:null};
function shot(n=1){return{id:`SHOT_${String(n).padStart(2,'0')}`,title:`ช็อต ${n}`,duration:10,action:'',goal:'',obstacle:'',decision:'',change:'',cause:'',locationId:'',sceneCondition:'',characterIds:[],states:{},speaker:'',listener:'',eyeLine:'มองคู่สนทนา ไม่มองเลนส์',intention:'',emotion:'เป็นธรรมชาติ',performance:'แสดงอย่างเป็นธรรมชาติ มีจังหวะคิดและปฏิกิริยาจริง',framing:'Medium Shot',angle:'ระดับสายตา',focus:'ใบหน้าและดวงตา',movement:'กล้องนิ่ง',beforePause:'เงียบก่อนพูดเล็กน้อย',afterPause:'เว้นจังหวะให้เห็นปฏิกิริยา',startFrame:'',endFrame:'',imageCheck:'ยังไม่ได้ตรวจ',voiceCheck:'ยังไม่ได้ตรวจ',continuityCheck:'ยังไม่ได้ตรวจ',status:'ร่าง',notes:'',dialogue:[]};}
function clip(n=1){return{id:`CLIP_${String(n).padStart(3,'0')}`,title:`คลิป ${n}`,purpose:'',in:'',out:'',status:'ร่าง',shots:[shot()]};}
function fresh(){const p={id:`PRJ-${Date.now().toString(36).toUpperCase()}`,title:'โปรเจกต์ละครใหม่',platform:'Google Flow',ratio:'9:16',total:30,quality:'สูงสุดที่แพลตฟอร์มรองรับ',genres:['ดราม่า','ระทึกขวัญ'],effects:[],era:'ร่วมสมัย',audience:'ผู้ชมทั่วไป',premise:'',beats:[],characters:[],locations:[],clips:[clip()],versions:[],updated:now()};return p;}
function load(){try{const x=JSON.parse(localStorage.getItem('aps-static-projects')||'[]');return Array.isArray(x)?x:[]}catch{return[]}}
state.projects=load();if(!state.projects.length)state.projects=[fresh()];state.projectId=state.projects[0].id;state.clipId=state.projects[0].clips[0].id;state.shotId=state.projects[0].clips[0].shots[0].id;
const project=()=>state.projects.find(p=>p.id===state.projectId)||state.projects[0];
const currentClip=()=>project().clips.find(c=>c.id===state.clipId)||project().clips[0];
const currentShot=()=>currentClip().shots.find(s=>s.id===state.shotId)||currentClip().shots[0];
const currentChar=()=>project().characters.find(c=>c.id===state.charId)||project().characters[0];
const currentLoc=()=>project().locations.find(l=>l.id===state.locId)||project().locations[0];
function save(){const p=project();p.updated=now();$('#save-status').textContent='กำลังบันทึก…';$('#save-indicator').textContent='◌ Saving';clearTimeout(state.saveTimer);state.saveTimer=setTimeout(()=>{try{localStorage.setItem('aps-static-projects',JSON.stringify(state.projects));$('#save-status').textContent='บันทึกในเบราว์เซอร์แล้ว';$('#save-indicator').textContent='● Saved';}catch(e){toast('พื้นที่จัดเก็บในเบราว์เซอร์เต็ม โปรดส่งออก JSON สำรองไว้');}},350);$('#project-title').textContent=p.title;$('#project-code').textContent=p.id;}
function toast(s){$('#toast').textContent=s;$('#toast').classList.remove('toast-hidden');setTimeout(()=>$('#toast').classList.add('toast-hidden'),2600)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function field(label,path,value,kind='input',opts={}){const attr=`data-path="${path}"`;const val=esc(value);if(kind==='textarea')return `<label class="field">${label}<textarea ${attr} rows="${opts.rows||2}" placeholder="${esc(opts.placeholder||'')}">${val}</textarea></label>`;if(kind==='select')return `<label class="field">${label}<select ${attr}>${opts.options.map(x=>`<option ${x===value?'selected':''}>${esc(x)}</option>`).join('')}</select></label>`;return `<label class="field">${label}<input ${attr} value="${val}" placeholder="${esc(opts.placeholder||'')}" ${opts.type?`type="${opts.type}"`:''}></label>`;}
function title(eyebrow,h,sub='',action=''){return `<div class="panel-title"><div><div class="eyebrow">${eyebrow}</div><h2>${h}</h2>${sub?`<p>${sub}</p>`:''}</div>${action}</div>`}
function chipGroup(list,selected,attr){return `<div class="chips">${list.map(x=>`<button class="chip ${selected.includes(x)?'on':''}" data-toggle="${attr}" data-value="${esc(x)}">${selected.includes(x)?'✓ ':''}${esc(x)}</button>`).join('')}</div>`}
function nav(){const items=[['overview','▦','ภาพรวม'],['story','✦','วางโครงเรื่อง'],['characters','♙','คลังตัวละคร'],['locations','⌖','คลังสถานที่'],['director','▣','กำกับรายช็อต'],['continuity','✓','ตรวจความต่อเนื่อง'],['review','◫','ตรวจงาน'],['library','▤','โปรเจกต์ / เวอร์ชัน']];$('#nav').innerHTML=items.map(([id,icon,label])=>`<button class="nav ${state.tab===id?'active':''}" data-tab="${id}"><span>${icon}</span>${label}${id==='continuity'&&issues().length?`<em>${issues().length}</em>`:''}</button>`).join('');}
function overview(){const p=project();return `<section class="hero"><div><div class="eyebrow">YOUR CINEMATIC CONTROL ROOM</div><h2>เล่าเรื่องให้ต่อเนื่อง<br><em>ควบคุมทุกช็อตได้จริง</em></h2><p>แยกตัวตนของตัวละครออกจากชุดและสถานะในฉาก วางบทก่อนสร้าง และตรวจงานเป็นรายช็อต</p><button class="btn primary" data-tab="story">เริ่มวางโครงเรื่อง →</button> <button class="btn outline" data-tab="director">ไปที่ Clip Director</button></div><div class="orb"><div class="core">✳</div></div></section><div class="eyebrow">PROJECT SNAPSHOT</div><div class="metric-grid">${[[p.characters.length,'ตัวละคร','CHARACTER DNA'],[p.locations.length,'สถานที่','LOCATION DNA'],[p.clips.length,'คลิป','10 SECONDS EACH'],[p.clips.reduce((a,c)=>a+c.shots.length,0),'ช็อต','SHOT DIRECTOR'],[issues().length,'จุดที่ต้องตรวจ','CONTINUITY']].map(x=>`<div class="metric"><small>${x[2]}</small><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div><div class="grid2"><section class="panel"><div class="eyebrow">PRODUCTION PIPELINE</div><h3>ขั้นตอนการผลิต</h3><div class="flow">${[['01','ตั้งค่าเรื่อง','story'],['02','ตัวละครและชุด','characters'],['03','สถานที่','locations'],['04','กำกับช็อต','director'],['05','ตรวจต่อเนื่อง','continuity'],['06','ตรวจคุณภาพ','review']].map(x=>`<button data-tab="${x[2]}"><b>${x[0]}</b>${x[1]}<small>เปิดพื้นที่ทำงาน →</small></button>`).join('')}</div></section><section class="panel"><div class="eyebrow">CURRENT PROJECT</div><h3>ข้อมูลหลัก</h3><div class="summary"><span>แพลตฟอร์ม</span><b>${esc(p.platform)}</b></div><div class="summary"><span>อัตราส่วน</span><b>${esc(p.ratio)}</b></div><div class="summary"><span>แนวเรื่อง</span><b>${esc(p.genres.join(' / '))}</b></div><div class="summary"><span>คลิปเป้าหมาย</span><b>${p.total}</b></div><div class="summary"><span>เวอร์ชันสำรอง</span><b>${p.versions.length}</b></div></section></div><section class="panel"><div class="panel-title"><h3>คลิปในโปรเจกต์</h3><button class="btn outline" data-tab="director">เปิด Clip Director</button></div>${p.clips.slice(0,8).map(c=>`<div class="summary"><span>${c.id} · ${esc(c.title)}</span><b>${c.shots.length} ช็อต · ${esc(c.status)}</b></div>`).join('')}</section>`;}
function story(){const p=project();return `<section class="panel">${title('01 / STORY DEVELOPMENT','วางโครงเรื่องก่อนสร้างคลิป','แนวคิด → โครงเรื่อง → ฉาก → เหตุการณ์ → ช็อต → บทพูด → วิดีโอ')}<div class="cols3">${field('ชื่อโปรเจกต์','title',p.title)}${field('แพลตฟอร์ม AI','platform',p.platform,'select',{options:PLATFORMS})}${field('จำนวนคลิป','total',String(p.total),'select',{options:['30','60','130']})}${field('อัตราส่วนภาพ','ratio',p.ratio,'select',{options:['9:16','16:9','1:1']})}${field('ยุค / ช่วงเวลา','era',p.era)}${field('กลุ่มผู้ชม','audience',p.audience,'select',{options:['ผู้ชมทั่วไป','วัยรุ่น','ผู้ใหญ่','ครอบครัว']})}</div><div class="sub-label">แนวเรื่อง <small>เลือกได้หลายแนว</small></div>${chipGroup(GENRES,p.genres,'genres')}<div class="sub-label">เอฟเฟกต์และกลไกพิเศษ <small>เลือกระดับความอลังการที่ต้องการ</small></div>${chipGroup(EFFECTS,p.effects,'effects')}${field('พล็อตหลัก / แนวคิดเรื่อง','premise',p.premise,'textarea',{rows:5,placeholder:'ตัวเอกต้องการอะไร โลกของเรื่องเป็นอย่างไร ความขัดแย้งหลักคืออะไร'})}<div class="subhead"><div><h3>Story Beats / จังหวะเหตุการณ์หลัก</h3><small>ระบุเป้าหมาย อุปสรรค การตัดสินใจ และผลลัพธ์ของแต่ละจังหวะ</small></div><button class="btn outline" data-act="add-beat">＋ เพิ่มจังหวะเรื่อง</button></div>${p.beats.length?p.beats.map((b,i)=>`<div class="item-card"><div class="item-head"><b>BEAT ${i+1} · ${esc(b.title)}</b><button class="btn danger" data-act="del-beat" data-id="${b.id}">ลบ</button></div>${field('ชื่อเหตุการณ์',`beats.${i}.title`,b.title)}<div class="cols2">${field('ตัวละครต้องการอะไร',`beats.${i}.goal`,b.goal,'textarea')}${field('อะไรขัดขวาง',`beats.${i}.obstacle`,b.obstacle,'textarea')}${field('ตัดสินใจ / ลงมือทำอะไร',`beats.${i}.decision`,b.decision,'textarea')}${field('ผลลัพธ์ที่เปลี่ยนสถานการณ์',`beats.${i}.outcome`,b.outcome,'textarea')}</div>${field('เหตุการณ์นี้นำไปสู่อะไร',`beats.${i}.leadsTo`,b.leadsTo)}</div>`).join(''):'<div class="empty">ยังไม่มี Story Beat เพิ่มจังหวะเรื่องเพื่อวางเหตุและผล</div>'}<div class="hint">ระบบจะไม่แก้โครงเรื่องหรือบทที่คุณอนุมัติแล้วเองโดยเงียบ ๆ คำเตือนจากตัวตรวจเป็นเพียงข้อเสนอ</div></section>`;}
function characters(){const p=project();const c=currentChar();return `<section class="panel">${title('02 / CHARACTER LIBRARY','คลังตัวละครและชุดแต่งกาย','ชั้น 1 ตัวตนถาวร · ชั้น 2 รูปลักษณ์ประจำฉาก · ชั้น 3 สถานะต่อเนื่องรายช็อต',`<button class="btn primary" data-act="add-char">＋ เพิ่มตัวละคร</button>`)}<div class="list-layout"><aside class="rail">${p.characters.map(x=>`<button class="select-row ${c?.id===x.id?'on':''}" data-select-char="${x.id}"><span class="avatar">♙</span><span><b>${esc(x.name||'ยังไม่ตั้งชื่อ')}</b><small>${x.id} · ${esc(x.role)}</small></span></button>`).join('')||'<div class="empty">ยังไม่มีตัวละคร</div>'}</aside><div class="editor">${c?`<div class="editor-head"><div><div class="eyebrow">${c.id} / PERMANENT IDENTITY</div><h3>${esc(c.name||'ตัวตนของตัวละคร')}</h3></div><button class="btn ${c.approved?'outline':'primary'}" data-act="toggle-char-approval">${c.approved?'✓ ตัวตนอนุมัติแล้ว':'อนุมัติภาพ/ตัวตน'}</button></div><div class="cols2">${field('ชื่อตัวละคร',`characters.${p.characters.indexOf(c)}.name`,c.name)}${field('บทบาท',`characters.${p.characters.indexOf(c)}.role`,c.role)}${field('ช่วงอายุ',`characters.${p.characters.indexOf(c)}.age`,c.age)}${field('ภูมิหลัง',`characters.${p.characters.indexOf(c)}.background`,c.background)}</div><div class="sub-label">ชั้นที่ 1 · ตัวตนถาวร <small>ลักษณะที่ไม่ควรเปลี่ยนโดยไม่มีเหตุผล</small></div><div class="cols2">${['face','eyes','brows','nose','lips','skin','marks','body','height','hairColor','hairstyle','walk','manner','speechStyle','personality'].map((k)=>field(({face:'รูปหน้า',eyes:'ดวงตา',brows:'คิ้ว',nose:'จมูก',lips:'ปาก',skin:'สีผิว',marks:'ตำหนิ/จุดสังเกต',body:'รูปร่างและสัดส่วน',height:'ส่วนสูง',hairColor:'สีผม',hairstyle:'ทรงผมและแนวไรผม',walk:'การเดิน',manner:'กิริยา',speechStyle:'สไตล์การพูด',personality:'บุคลิก'})[k],`characters.${p.characters.indexOf(c)}.${k}`,c[k],'textarea')).join('')}</div><div class="sub-label">ภาพอ้างอิงที่อนุมัติ <small>วาง URL ภาพหน้าตรง ด้านข้าง สามส่วนสี่ และเต็มตัว</small></div><div class="cols2">${[['refFront','หน้าตรง'],['refSide','ด้านข้าง'],['refThree','สามส่วนสี่'],['refFull','เต็มตัว']].map(([k,l])=>field(`ภาพอ้างอิง ${l}`,`characters.${p.characters.indexOf(c)}.${k}`,c[k])).join('')}</div><div class="subhead"><div><h3>ชั้นที่ 2 · รูปลักษณ์ประจำฉาก</h3><small>หลายชุดต่อหนึ่งตัวละคร แต่ต้องเลือก Wardrobe ID ในแต่ละช็อต</small></div><button class="btn outline" data-act="add-wardrobe">＋ เพิ่มชุด</button></div>${c.wardrobes.map((w,i)=>`<div class="item-card"><div class="item-head"><b>${w.id} · ${esc(w.name)}</b><button class="btn danger" data-act="del-wardrobe" data-id="${w.id}">ลบชุด</button></div><div class="cols2">${field('ชื่อชุด / ฉากที่ใช้',`characters.${p.characters.indexOf(c)}.wardrobes.${i}.name`,w.name)}${field('คลิปหรือฉากที่ใช้',`characters.${p.characters.indexOf(c)}.wardrobes.${i}.scenes`,w.scenes)}${field('เสื้อผ้า สี วัสดุ ลวดลาย',`characters.${p.characters.indexOf(c)}.wardrobes.${i}.outfit`,w.outfit,'textarea')}${field('วิธีสวมใส่ / การพับ / กระดุม',`characters.${p.characters.indexOf(c)}.wardrobes.${i}.wearing`,w.wearing,'textarea')}${field('รองเท้า',`characters.${p.characters.indexOf(c)}.wardrobes.${i}.shoes`,w.shoes)}${field('เครื่องประดับ',`characters.${p.characters.indexOf(c)}.wardrobes.${i}.accessories`,w.accessories)}${field('ของที่พก / อุปกรณ์',`characters.${p.characters.indexOf(c)}.wardrobes.${i}.props`,w.props)}${field('ทรงผมเฉพาะชุด',`characters.${p.characters.indexOf(c)}.wardrobes.${i}.hair`,w.hair)}${field('สภาพเสื้อผ้า',`characters.${p.characters.indexOf(c)}.wardrobes.${i}.condition`,w.condition,'select',{options:['ปกติ','เปียก','เปื้อนฝุ่น','ฉีกขาด','ตามเนื้อเรื่อง']})}</div></div>`).join('')||'<div class="empty">ยังไม่มีชุดแต่งกาย เพิ่มชุดเพื่อกำหนดรูปลักษณ์ประจำฉาก</div>'}<div class="actions-row"><button class="btn danger" data-act="del-char">ลบตัวละคร</button><span class="muted">ข้อมูลตัวตนจะถูกนำไปแนบใน Prompt ทุกช็อตที่เลือก</span></div>`:'<div class="empty">เพิ่มตัวละครเพื่อสร้าง Character Bible</div>'}</div></div></section>`;}
function locations(){const p=project(),l=currentLoc();return `<section class="panel">${title('03 / LOCATION LIBRARY','คลังสถานที่และผังฉาก','แยกโครงสร้างถาวรจากสภาพฉาก เช่น กลางวัน/กลางคืน ฝน และแสง',`<button class="btn primary" data-act="add-loc">＋ เพิ่มสถานที่</button>`)}<div class="list-layout"><aside class="rail">${p.locations.map(x=>`<button class="select-row ${l?.id===x.id?'on':''}" data-select-loc="${x.id}"><span class="avatar">⌖</span><span><b>${esc(x.name||'สถานที่ใหม่')}</b><small>${x.id}</small></span></button>`).join('')||'<div class="empty">ยังไม่มีสถานที่</div>'}</aside><div class="editor">${l?`<div class="editor-head"><div><div class="eyebrow">${l.id} / FIXED SET LAYOUT</div><h3>${esc(l.name||'รายละเอียดสถานที่')}</h3></div><span class="badge">LOCATION DNA</span></div><div class="cols2">${field('ชื่อสถานที่',`locations.${p.locations.indexOf(l)}.name`,l.name)}${field('สถาปัตยกรรม / ยุคสมัย',`locations.${p.locations.indexOf(l)}.architecture`,l.architecture,'textarea')}${field('ผังฉาก / จุดอ้างอิง',`locations.${p.locations.indexOf(l)}.layout`,l.layout,'textarea')}${field('ตำแหน่งประตู / หน้าต่าง',`locations.${p.locations.indexOf(l)}.doors`,l.doors,'textarea')}${field('ตำแหน่งเฟอร์นิเจอร์',`locations.${p.locations.indexOf(l)}.furniture`,l.furniture,'textarea')}${field('อุปกรณ์ประกอบฉากถาวร',`locations.${p.locations.indexOf(l)}.props`,l.props,'textarea')}${field('วัสดุ / สี / พื้นผิว',`locations.${p.locations.indexOf(l)}.materials`,l.materials,'textarea')}${field('ระบบแสงประจำสถานที่',`locations.${p.locations.indexOf(l)}.lighting`,l.lighting,'textarea')}${field('ภาพอ้างอิงสถานที่ (URL)',`locations.${p.locations.indexOf(l)}.ref`,l.ref)}</div><button class="btn danger" data-act="del-loc">ลบสถานที่</button>`:'<div class="empty">เพิ่ม Location Bible เพื่อกำหนดตำแหน่งประตู หน้าต่าง และเฟอร์นิเจอร์ให้คงที่</div>'}</div></div></section>`;}
function director(){const p=project(),c=currentClip(),s=currentShot();if(!c||!s)return '';const idx=p.clips.indexOf(c),prev=p.clips[idx-1];return `<section class="panel">${title('04 / DIRECTOR WORKSPACE','กำกับรายช็อตและแก้บทพูด','คลิปละ 10 วินาที · แบ่งหลายช็อตได้ · บทพูดแก้ได้ในหน้าช็อตโดยตรง',`<button class="btn primary" data-act="add-clip">＋ เพิ่มคลิป</button>`)}<div class="director"><div class="rail-box clips"><div class="rail-title">CLIPS <span>${p.clips.length}</span></div>${p.clips.map(x=>`<button class="clip-btn ${x.id===c.id?'on':''}" data-select-clip="${x.id}"><b>${x.id}</b><span>${esc(x.title)}</span><small>${x.shots.length} shots</small></button>`).join('')}</div><div class="rail-box shots"><div class="rail-title">SHOTS <span>${c.shots.reduce((a,x)=>a+x.duration,0)}s / 10s</span></div>${c.shots.map(x=>`<button class="shot-btn ${x.id===s.id?'on':''}" data-select-shot="${x.id}"><b>${x.id}</b><span>${esc(x.title)}</span><small>${x.duration}s · ${esc(x.status)}</small></button>`).join('')}<button class="btn outline" data-act="add-shot">＋ เพิ่มช็อต</button><div class="duration"><i style="width:${Math.min(100,c.shots.reduce((a,x)=>a+x.duration,0)*10)}%"></i></div></div><div class="shot-edit"><div class="shot-head"><div><div class="eyebrow">${c.id} / ${s.id}</div><h3>${esc(s.title)}</h3></div><select class="status" data-path="clips.${idx}.shots.${c.shots.indexOf(s)}.status"><option ${s.status==='ร่าง'?'selected':''}>ร่าง</option><option ${s.status==='รอตรวจ'?'selected':''}>รอตรวจ</option><option ${s.status==='อนุมัติ'?'selected':''}>อนุมัติ</option></select></div><div class="cols3">${field('ชื่อคลิป',`clips.${idx}.title`,c.title)}${field('หน้าที่ของคลิป',`clips.${idx}.purpose`,c.purpose)}${field('ชื่อช็อต',`clips.${idx}.shots.${c.shots.indexOf(s)}.title`,s.title)}${field('เวลาช็อต (วินาที)',`clips.${idx}.shots.${c.shots.indexOf(s)}.duration`,s.duration,'input',{type:'number'})}</div><div class="sub-label">เหตุและผลของเหตุการณ์</div><div class="cols2">${field('ตัวละครต้องการอะไร',`clips.${idx}.shots.${c.shots.indexOf(s)}.goal`,s.goal,'textarea')}${field('อะไรขัดขวาง',`clips.${idx}.shots.${c.shots.indexOf(s)}.obstacle`,s.obstacle,'textarea')}${field('ตัดสินใจ / ลงมือทำอะไร',`clips.${idx}.shots.${c.shots.indexOf(s)}.decision`,s.decision,'textarea')}${field('สถานการณ์เปลี่ยนอย่างไร',`clips.${idx}.shots.${c.shots.indexOf(s)}.change`,s.change,'textarea')}</div>${field('สิ่งที่พาไปยังฉากถัดไป',`clips.${idx}.shots.${c.shots.indexOf(s)}.cause`,s.cause)}${field('Action / การกระทำที่เห็นบนภาพ',`clips.${idx}.shots.${c.shots.indexOf(s)}.action`,s.action,'textarea',{rows:3})}<div class="sub-label">เลือกตัวละครและ Scene State</div>${p.characters.map(ch=>`<label class="checkbox"><input type="checkbox" data-character-shot="${ch.id}" ${s.characterIds.includes(ch.id)?'checked':''}> ${esc(ch.name||ch.id)} · ${ch.id}</label>`).join('')||'<div class="empty">เพิ่มตัวละครในคลังตัวละครก่อน</div>'}${s.characterIds.map(cid=>{const ch=p.characters.find(x=>x.id===cid);if(!ch)return '';const st=s.states[cid]||{wardrobe:'',position:'',facing:'',item:'',hand:'ไม่ถือ',eye:'คู่สนทนา',emotion:'ปกติ',knowledge:'',next:''};return `<div class="state-card"><b>${esc(ch.name||cid)} · SCENE STATE</b><div class="cols2">${field('ชุดที่ใช้',`clips.${idx}.shots.${c.shots.indexOf(s)}.states.${cid}.wardrobe`,st.wardrobe,'select',{options:['',...ch.wardrobes.map(w=>w.id)]})}${field('ตำแหน่งในฉาก',`clips.${idx}.shots.${c.shots.indexOf(s)}.states.${cid}.position`,st.position)}${field('ทิศทาง / หันหน้า',`clips.${idx}.shots.${c.shots.indexOf(s)}.states.${cid}.facing`,st.facing)}${field('กำลังถืออะไร',`clips.${idx}.shots.${c.shots.indexOf(s)}.states.${cid}.item`,st.item)}${field('ถือด้วยมือ',`clips.${idx}.shots.${c.shots.indexOf(s)}.states.${cid}.hand`,st.hand,'select',{options:['ไม่ถือ','มือซ้าย','มือขวา','สองมือ']})}${field('เป้าหมายสายตา',`clips.${idx}.shots.${c.shots.indexOf(s)}.states.${cid}.eye`,st.eye)}${field('อารมณ์',`clips.${idx}.shots.${c.shots.indexOf(s)}.states.${cid}.emotion`,st.emotion)}${field('รู้อะไรแล้วในเรื่อง',`clips.${idx}.shots.${c.shots.indexOf(s)}.states.${cid}.knowledge`,st.knowledge,'textarea')}${field('กำลังจะทำอะไรต่อ',`clips.${idx}.shots.${c.shots.indexOf(s)}.states.${cid}.next`,st.next,'textarea')}</div></div>`}).join('')}<div class="sub-label">สถานที่และสภาพฉาก</div><div class="cols2">${field('สถานที่',`clips.${idx}.shots.${c.shots.indexOf(s)}.locationId`,s.locationId,'select',{options:['',...p.locations.map(l=>l.id)]})}${field('สภาพเฉพาะฉาก',`clips.${idx}.shots.${c.shots.indexOf(s)}.sceneCondition`,s.sceneCondition,'textarea')}</div><div class="sub-label">แผงกำกับการแสดงและกล้อง</div><div class="cols2">${field('คนพูด',`clips.${idx}.shots.${c.shots.indexOf(s)}.speaker`,s.speaker,'select',{options:['',...s.characterIds.map(id=>p.characters.find(x=>x.id===id)?.name||id)]})}${field('คนฟัง',`clips.${idx}.shots.${c.shots.indexOf(s)}.listener`,s.listener,'select',{options:['',...s.characterIds.map(id=>p.characters.find(x=>x.id===id)?.name||id)]})}${field('เป้าหมายสายตา',`clips.${idx}.shots.${c.shots.indexOf(s)}.eyeLine`,s.eyeLine)}${field('เจตนาของประโยค',`clips.${idx}.shots.${c.shots.indexOf(s)}.intention`,s.intention)}${field('ระดับอารมณ์',`clips.${idx}.shots.${c.shots.indexOf(s)}.emotion`,s.emotion)}${field('การแสดง / ท่าทาง',`clips.${idx}.shots.${c.shots.indexOf(s)}.performance`,s.performance,'textarea')}${field('ขนาดภาพ',`clips.${idx}.shots.${c.shots.indexOf(s)}.framing`,s.framing,'select',{options:['Extreme Wide','Wide','Medium','Medium Close-up','Close-up','Extreme Close-up','Over-the-Shoulder','POV','Reaction Shot']})}${field('มุมกล้อง',`clips.${idx}.shots.${c.shots.indexOf(s)}.angle`,s.angle,'select',{options:['ระดับสายตา','มุมต่ำ','มุมสูง','Dutch Angle','Over-the-Shoulder']})}${field('จุดโฟกัส',`clips.${idx}.shots.${c.shots.indexOf(s)}.focus`,s.focus)}${field('การเคลื่อนกล้อง',`clips.${idx}.shots.${c.shots.indexOf(s)}.movement`,s.movement,'select',{options:['กล้องนิ่ง','Pan','Tilt','Dolly In','Dolly Out','Tracking','Handheld','Crane']})}${field('จังหวะก่อนพูด',`clips.${idx}.shots.${c.shots.indexOf(s)}.beforePause`,s.beforePause)}${field('จังหวะหลังพูด',`clips.${idx}.shots.${c.shots.indexOf(s)}.afterPause`,s.afterPause)}</div><div class="subhead"><div><h3>บทพูดและเสียง</h3><small>แยกประโยคเพื่อแก้ข้อความและคำอ่านได้โดยตรง</small></div><button class="btn outline" data-act="add-line">＋ เพิ่มประโยค</button></div>${s.dialogue.map((d,i)=>`<div class="dialogue"><div class="dialogue-top"><b>ประโยค ${i+1}</b><label class="checkbox"><input type="checkbox" data-path="clips.${idx}.shots.${c.shots.indexOf(s)}.dialogue.${i}.approved" ${d.approved?'checked':''}> อนุมัติ</label><button class="btn danger" data-act="del-line" data-id="${d.id}">ลบ</button></div><div class="cols2">${field('ผู้พูด',`clips.${idx}.shots.${c.shots.indexOf(s)}.dialogue.${i}.speaker`,d.speaker,'select',{options:['',...p.characters.map(x=>x.name||x.id)]})}${field('อารมณ์เสียง',`clips.${idx}.shots.${c.shots.indexOf(s)}.dialogue.${i}.emotion`,d.emotion)}</div>${field('บทพูดต้นฉบับ',`clips.${idx}.shots.${c.shots.indexOf(s)}.dialogue.${i}.text`,d.text,'textarea')}${field('คำอ่าน / ช่วยออกเสียง',`clips.${idx}.shots.${c.shots.indexOf(s)}.dialogue.${i}.pronunciation`,d.pronunciation)}<div class="cols3">${field('ความเร็ว',`clips.${idx}.shots.${c.shots.indexOf(s)}.dialogue.${i}.pace`,d.pace,'select',{options:['ปกติ','ช้า','เร็ว']})}${field('หยุดก่อนพูด',`clips.${idx}.shots.${c.shots.indexOf(s)}.dialogue.${i}.pauseBefore`,d.pauseBefore)}${field('หยุดหลังพูด',`clips.${idx}.shots.${c.shots.indexOf(s)}.dialogue.${i}.pauseAfter`,d.pauseAfter)}</div>${field('ข้อความซับไตเติล',`clips.${idx}.shots.${c.shots.indexOf(s)}.dialogue.${i}.subtitle`,d.subtitle)}</div>`).join('')||'<div class="empty">ยังไม่มีบทพูดในช็อตนี้</div>'}<div class="actions-row"><button class="btn outline" data-act="voice-preview">ฟังตัวอย่างเสียงในเบราว์เซอร์</button><button class="btn outline" data-act="build-prompt">ประกอบ Prompt</button><button class="btn danger" data-act="del-shot">ลบช็อตนี้</button></div>${state.prompt?`<div class="sub-label">PROMPT OUTPUT</div><textarea class="field prompt" id="prompt-output" rows="18">${esc(state.prompt)}</textarea><button class="btn primary" data-act="copy-prompt">คัดลอก Prompt</button>`:''}<div class="sub-label">Handoff / ส่งต่อคลิป</div><div class="cols2">${field('เชื่อมเข้าคลิปนี้จากคลิปก่อน',`clips.${idx}.in`,c.in,'textarea')}${field('สถานะท้ายคลิปนี้',`clips.${idx}.out`,c.out,'textarea')}</div><div class="hint">ทุกคลิปต้องมีหลายช็อตได้ตามต้องการ แต่ผลรวมเวลาต้องเท่ากับ 10 วินาที ระบบจะแจ้งเตือนเมื่อเวลาไม่ครบ</div></div></div></section>`;}
function issues(){const p=project(),out=[];let prev=null;for(const c of p.clips){let total=c.shots.reduce((a,s)=>a+Number(s.duration||0),0);if(total!==10)out.push({type:'ERROR',where:c.id,text:`ความยาวรวม ${total} วินาที ไม่เท่ากับ 10 วินาที`,fix:'ปรับเวลาช็อตให้รวมเป็น 10 วินาที'});if(!c.purpose)out.push({type:'WARN',where:c.id,text:'ยังไม่ได้ระบุหน้าที่ของคลิปในเรื่อง',fix:'ระบุว่าคลิปนี้ทำให้เรื่องเดินหน้าอย่างไร'});for(const s of c.shots){if(!s.action)out.push({type:'WARN',where:`${c.id} / ${s.id}`,text:'ยังไม่ได้เขียนการกระทำของช็อต',fix:'ระบุสิ่งที่เห็นบนภาพ'});if(s.dialogue.some(d=>(d.text||'').length>s.duration*18))out.push({type:'WARN',where:`${c.id} / ${s.id}`,text:'บทพูดอาจยาวเกินเวลาช็อต (เป็นค่าประมาณ)',fix:'ฟังเสียงทดลองหรือย่อบทพูด'});if(s.characterIds.some(cid=>!p.characters.find(x=>x.id===cid)?.approved))out.push({type:'WARN',where:`${c.id} / ${s.id}`,text:'มีตัวละครที่ยังไม่อนุมัติตัวตน/ภาพอ้างอิง',fix:'ตรวจภาพอ้างอิงและอนุมัติตัวตน'});for(const cid of s.characterIds){const st=s.states[cid]||{};if(!st.wardrobe)out.push({type:'WARN',where:`${c.id} / ${s.id}`,text:`ยังไม่ได้เลือกชุดของ ${p.characters.find(x=>x.id===cid)?.name||cid}`,fix:'เลือก Wardrobe ID ให้ตรงกับฉาก'});if(!st.position)out.push({type:'NOTE',where:`${c.id} / ${s.id}`,text:`ยังไม่ระบุตำแหน่งของ ${p.characters.find(x=>x.id===cid)?.name||cid}`,fix:'ระบุตำแหน่งยืน/นั่งและทิศทาง'});if(prev&&prev.states?.[cid]?.hand&&st.hand&&prev.states[cid].hand!==st.hand&&!s.action.includes('เปลี่ยนมือ')&&!s.action.includes('ส่งต่อ'))out.push({type:'WARN',where:`${c.id} / ${s.id}`,text:'มือที่ถืออุปกรณ์เปลี่ยนโดยไม่มีจังหวะเปลี่ยนมือ',fix:'เพิ่มจังหวะเปลี่ยนมือหรือแก้สถานะให้ตรง'});}if(prev&&prev.locationId&&s.locationId&&prev.locationId!==s.locationId&&!s.sceneCondition.includes('ตัดไป'))out.push({type:'WARN',where:`${c.id} / ${s.id}`,text:'สถานที่เปลี่ยนโดยไม่ระบุจังหวะตัดภาพ',fix:'เพิ่ม transition หรือช็อตเชื่อม'});if(s.status==='อนุมัติ'&&s.dialogue.some(d=>!d.approved))out.push({type:'WARN',where:`${c.id} / ${s.id}`,text:'ช็อตอนุมัติแล้วแต่มีบทพูดที่ยังไม่อนุมัติ',fix:'ตรวจและอนุมัติบทพูดก่อนล็อกช็อต'});prev=s;}}return out;}
function continuity(){const x=issues();return `<section class="panel">${title('05 / CONTINUITY CHECKER','ตรวจบทและความต่อเนื่องก่อนสร้าง','ตรวจจากกฎข้อมูลที่กรอก ระบบไม่แก้บทที่อนุมัติแล้วเอง')}<div class="metric-grid"><div class="metric"><small>ERROR</small><b>${x.filter(y=>y.type==='ERROR').length}</b><span>ข้อผิดพลาด</span></div><div class="metric"><small>WARNING</small><b>${x.filter(y=>y.type==='WARN').length}</b><span>คำเตือน</span></div><div class="metric"><small>NOTE</small><b>${x.filter(y=>y.type==='NOTE').length}</b><span>ข้อมูลที่ควรเติม</span></div></div>${x.length?`<div class="issues">${x.map(i=>`<div class="issue ${i.type==='ERROR'?'error':i.type==='NOTE'?'info':''}"><em>${i.type}</em><div><b>${esc(i.where)}</b><p>${esc(i.text)}</p><small>แนวทางแก้: ${esc(i.fix)}</small></div><button class="btn outline" data-issue="${esc(i.where)}">ไปแก้</button></div>`).join('')}</div>`:'<div class="empty">✓ ไม่พบปัญหาตามกฎที่เปิดใช้งาน ยังควรตรวจผลภาพและเสียงจากโมเดลจริงก่อนอนุมัติ</div>'}<div class="hint">ตัวตรวจความยาวบทพูดเป็นค่าประมาณ ไม่สามารถยืนยันความเร็วหรือการออกเสียงจากไฟล์เสียงจริงได้ และยังไม่เข้าใจข้อเท็จจริงทั้งหมดในบทโดยอัตโนมัติ</div></section>`;}
function review(){const c=currentClip(),s=currentShot();if(!c||!s)return '';const ci=project().clips.indexOf(c),si=c.shots.indexOf(s);const frame=(label,path,url)=>`<div class="frame"><b>${label}</b>${url?`<img src="${esc(url)}" alt="${label}">`:`<div class="frame-empty">＋<small>เพิ่ม URL ภาพอ้างอิง</small></div>`}<input data-path="${path}" value="${esc(url)}" placeholder="วาง URL ภาพ"></div>`;return `<section class="panel">${title('06 / REVIEW & QUALITY CONTROL','ตรวจงานก่อนอนุมัติ','เทียบเฟรมท้ายกับเฟรมเริ่มต้น ตรวจภาพ เสียง และความต่อเนื่อง')}<div class="cols2">${field('เลือกคลิป','reviewClip',c.id+' — '+c.title,'select',{options:project().clips.map(x=>x.id+' — '+x.title)})}${field('เลือกช็อต','reviewShot',s.id+' — '+s.title,'select',{options:c.shots.map(x=>x.id+' — '+x.title)})}</div><div class="review-grid">${frame('START FRAME',`clips.${ci}.shots.${si}.startFrame`,s.startFrame)}${frame('END FRAME',`clips.${ci}.shots.${si}.endFrame`,s.endFrame)}</div>${[['ความคมชัดและคุณภาพภาพ','imageCheck'],['เสียง บทพูด และลิปซิงก์','voiceCheck'],['ฉากและความต่อเนื่อง','continuityCheck']].map(([label,k])=>`<div class="review-row"><div><b>${label}</b><small>ตั้งผลตรวจและเก็บสถานะไว้กับช็อตนี้</small></div><select class="status" data-path="clips.${ci}.shots.${si}.${k}">${['ยังไม่ได้ตรวจ','ผ่าน','ต้องปรับปรุง','ต้องสร้างใหม่'].map(x=>`<option ${s[k]===x?'selected':''}>${x}</option>`)}</select></div>`).join('')}${field('บันทึกผลตรวจ / สิ่งที่ต้องแก้',`clips.${ci}.shots.${si}.notes`,s.notes,'textarea',{rows:3})}<div class="actions-row"><button class="btn primary" data-act="approve-shot">อนุมัติช็อตนี้</button><button class="btn outline" data-act="review-shot">ส่งตรวจอีกครั้ง</button><button class="btn danger" data-act="draft-shot">ต้องสร้างใหม่</button></div><div class="hint">ระบบยังไม่ได้เชื่อมสร้างวิดีโอ สร้างเสียงจริง อัปสเกล หรือรวมคลิป การตรวจและสถานะด้านบนเป็นการบันทึกผลตรวจโดยผู้ใช้</div></section>`;}
function library(){const p=project();return `<section class="panel">${title('07 / PROJECT LIBRARY','โปรเจกต์และประวัติเวอร์ชัน','บันทึกอัตโนมัติในเบราว์เซอร์ ส่งออก JSON เพื่อสำรองหรือย้ายเครื่อง',`<button class="btn primary" data-act="new-project">＋ โปรเจกต์ใหม่</button>`)}<input class="search" id="project-search" placeholder="ค้นหาโปรเจกต์…"><div id="project-list">${projectRows()}</div><div class="subhead"><div><h3>Version History</h3><small>บันทึกจุดย้อนกลับก่อนแก้ไขงานสำคัญ</small></div><button class="btn outline" data-act="save-version">＋ สร้างเวอร์ชัน</button></div>${p.versions.slice().reverse().map(v=>`<div class="version-row"><div><b>${esc(v.label)}</b><small>${new Date(v.time).toLocaleString('th-TH')}</small></div><button class="btn outline" data-act="restore" data-id="${v.id}">ย้อนกลับ</button></div>`).join('')||'<div class="empty">ยังไม่มีเวอร์ชันสำรอง</div>'}<div class="actions-row"><button class="btn outline" data-act="import">นำเข้า JSON</button><button class="btn outline" data-act="export-all">ส่งออกทุกโปรเจกต์</button></div><div class="hint">MVP บันทึกข้อมูลใน Local Storage ของเบราว์เซอร์นี้ ไม่ซิงก์ข้ามเครื่องและไม่ใช่ server backup ควรส่งออก JSON สำรองเป็นระยะ</div></section>`;}
function projectRows(){return state.projects.map(p=>`<div class="project-row ${p.id===state.projectId?'current':''}"><div class="project-icon">✳</div><div class="project-info"><b>${esc(p.title)}</b><small>${esc(p.genres.join(' · '))} · ${p.clips.length} คลิป · แก้ไข ${new Date(p.updated).toLocaleString('th-TH')}</small></div><button class="btn outline" data-open-project="${p.id}">เปิด</button><button class="btn outline" data-duplicate="${p.id}">ทำสำเนา</button><button class="btn danger" data-delete-project="${p.id}">ลบ</button></div>`).join('');}
function render(){nav();$('#project-title').textContent=project().title;$('#project-code').textContent=project().id;const views={overview,story,characters,locations,director,continuity,review,library};$('#view').innerHTML=views[state.tab]();bind();}
function setPath(path,val){const parts=path.split('.');let obj=project();for(let i=0;i<parts.length-1;i++){const k=parts[i];if(obj[k]===undefined)obj[k]=/^\d+$/.test(parts[i+1])?[]:{};obj=obj[k];}const last=parts.at(-1);if(last==='text'&&parts.includes('dialogue')&&obj[last]!==val)obj.approved=false;if(val==='__CHECK__')obj[last]=!obj[last];else if(last==='duration'||last==='total')obj[last]=Number(val);else obj[last]=val;save();}
function bind(){ $$('[data-path]').forEach(el=>{const handler=()=>{const v=el.type==='checkbox'?el.checked:el.value;if(el.dataset.path==='reviewClip'){const id=v.split(' — ')[0];state.clipId=id;state.shotId=currentClip().shots[0].id;render();return;}if(el.dataset.path==='reviewShot'){state.shotId=v.split(' — ')[0];render();return;}setPath(el.dataset.path,v);};el.addEventListener(el.type==='checkbox'||el.tagName==='SELECT'?'change':'input',handler);});$('#project-search')?.addEventListener('input',e=>{$('#project-list').innerHTML=state.projects.filter(p=>p.title.toLowerCase().includes(e.target.value.toLowerCase())).map(p=>projectRowsOne(p)).join('')});}
function projectRowsOne(p){return `<div class="project-row ${p.id===state.projectId?'current':''}"><div class="project-icon">✳</div><div class="project-info"><b>${esc(p.title)}</b><small>${esc(p.genres.join(' · '))} · ${p.clips.length} คลิป</small></div><button class="btn outline" data-open-project="${p.id}">เปิด</button><button class="btn outline" data-duplicate="${p.id}">ทำสำเนา</button><button class="btn danger" data-delete-project="${p.id}">ลบ</button></div>`;}
function saveVersion(label='บันทึกด้วยตนเอง'){const p=project();const snap=JSON.parse(JSON.stringify(p));snap.versions=[];p.versions.push({id:id(),time:now(),label,snapshot:snap});p.versions=p.versions.slice(-25);save();toast('สร้างเวอร์ชันสำรองแล้ว');if(state.tab==='library')render();}
function promptBuild(){const p=project(),c=currentClip(),s=currentShot(),prev=p.clips[p.clips.indexOf(c)-1];const lines=s.dialogue.map(d=>`${d.speaker||'ผู้พูด'}: “${d.text}” [คำอ่าน ${d.pronunciation||'ตามข้อความ'}; อารมณ์ ${d.emotion}; pace ${d.pace}]`).join('\n');const active=p.characters.filter(x=>s.characterIds.includes(x.id));state.prompt=[`AI VIDEO PROMPT — ${c.id} / ${s.id} — EXACTLY 10 SECONDS`,`PLATFORM ${p.platform} | ${p.ratio} | QUALITY ${p.quality}`,`GENRES ${p.genres.join(' / ')} | EFFECTS ${p.effects.join(' / ')}`,`STORY ${p.premise}`,`PREVIOUS HANDOFF ${prev?.out||c.in||'Use approved opening state; no unexplained jump.'}`,`GOAL ${s.goal} | OBSTACLE ${s.obstacle} | DECISION ${s.decision} | CHANGE ${s.change} | NEXT CAUSE ${s.cause}`,`ACTION ${s.action}`,`CHARACTER IDENTITY LOCK`,...active.map(ch=>{const st=s.states[ch.id]||{},w=ch.wardrobes.find(x=>x.id===st.wardrobe);return `${ch.id} ${ch.name}; face ${ch.face}; eyes ${ch.eyes}; skin ${ch.skin}; body ${ch.body}; hair ${ch.hairColor} ${ch.hairstyle}; identity approved ${ch.approved}; wardrobe ${w?JSON.stringify(w):'NOT SELECTED'}; position ${st.position}; facing ${st.facing}; holding ${st.item} with ${st.hand}; eye target ${st.eye}; emotion ${st.emotion}; knows ${st.knowledge}; next ${st.next}`;}),`LOCATION LOCK ${JSON.stringify(p.locations.find(x=>x.id===s.locationId)||{})}`,`SCENE CONDITION ${s.sceneCondition}`,`DIRECTING speaker ${s.speaker}; listener ${s.listener}; eye-line ${s.eyeLine}; intention ${s.intention}; emotion ${s.emotion}; performance ${s.performance}; pauses ${s.beforePause} / ${s.afterPause}`,`CAMERA framing ${s.framing}; angle ${s.angle}; focus ${s.focus}; movement ${s.movement}; maintain 180-degree axis and screen direction.`,`EXACT DIALOGUE\n${lines||'No dialogue.'}`,`SHOT DURATION ${s.duration} seconds within a 10-second clip.`,`HANDOFF ${s.change}; ${s.cause}`,`Preserve identity, hair, wardrobe, accessories, exact hand assignment, location geometry and props. No unmotivated changes.`,`Highest native quality supported; sharp eyes, stable anatomy, realistic motion. No captions, logos or music unless requested.`].join('\n\n');render();toast('ประกอบ Prompt แล้ว');}
function addCharacter(){const p=project(),n=p.characters.length+1;const c={id:`CHAR_${String(n).padStart(3,'0')}`,name:'',role:'ตัวละครหลัก',age:'',background:'',approved:false,face:'',eyes:'',brows:'',nose:'',lips:'',skin:'',marks:'',body:'',height:'',hairColor:'',hairstyle:'',walk:'',manner:'',speechStyle:'',personality:'',refFront:'',refSide:'',refThree:'',refFull:'',wardrobes:[]};p.characters.push(c);state.charId=c.id;save();render();}
function addWardrobe(){const c=currentChar();if(!c)return;c.wardrobes.push({id:`WARDROBE_${String(c.wardrobes.length+1).padStart(2,'0')}`,name:'ชุดใหม่',scenes:'',outfit:'',wearing:'',shoes:'',accessories:'',props:'',hair:'',condition:'ปกติ'});save();render();}
function addLocation(){const p=project(),l={id:`LOCATION_${String(p.locations.length+1).padStart(3,'0')}`,name:'',architecture:'',layout:'',doors:'',furniture:'',props:'',materials:'',lighting:'',ref:''};p.locations.push(l);state.locId=l.id;save();render();}
function addClip(){const c=clip(project().clips.length+1);project().clips.push(c);state.clipId=c.id;state.shotId=c.shots[0].id;state.tab='director';save();render();}
function addShot(){const c=currentClip();let total=c.shots.reduce((a,s)=>a+Number(s.duration||0),0),dur=Math.max(1,10-total);if(total>=10){dur=2;const found=c.shots.find(s=>s.duration>2);if(found)found.duration-=2;}const s=shot(c.shots.length+1);s.duration=dur;c.shots.push(s);state.shotId=s.id;save();render();}
function addDialogue(){const s=currentShot();s.dialogue.push({id:id(),speaker:s.speaker,text:'',pronunciation:'',subtitle:'',emotion:s.emotion,pace:'ปกติ',pauseBefore:'สั้น',pauseAfter:'สั้น',approved:false});save();render();}
function handleAction(act,idv){const p=project(),c=currentClip(),s=currentShot(),ch=currentChar();if(act==='add-char')addCharacter();if(act==='add-wardrobe')addWardrobe();if(act==='add-loc')addLocation();if(act==='add-clip')addClip();if(act==='add-shot')addShot();if(act==='add-line')addDialogue();if(act==='add-beat'){p.beats.push({id:id(),title:'จังหวะเรื่องใหม่',goal:'',obstacle:'',decision:'',outcome:'',leadsTo:''});save();render();}if(act==='del-beat'){p.beats=p.beats.filter(b=>b.id!==idv);save();render();}if(act==='del-wardrobe'&&ch){ch.wardrobes=ch.wardrobes.filter(w=>w.id!==idv);save();render();}if(act==='del-char'&&ch){if(confirm('ลบตัวละครนี้ออกจากโปรเจกต์?')){p.characters=p.characters.filter(x=>x.id!==ch.id);state.charId='';save();render();}}if(act==='del-loc'){p.locations=p.locations.filter(x=>x.id!==currentLoc()?.id);state.locId='';save();render();}if(act==='toggle-char-approval'&&ch){ch.approved=!ch.approved;save();render();}if(act==='del-shot'){if(c.shots.length===1){toast('คลิปต้องมีอย่างน้อยหนึ่งช็อต');return;}c.shots=c.shots.filter(x=>x.id!==s.id);state.shotId=c.shots[0].id;save();render();}if(act==='del-line'){s.dialogue=s.dialogue.filter(x=>x.id!==idv);save();render();}if(act==='build-prompt')promptBuild();if(act==='copy-prompt'){navigator.clipboard?.writeText(state.prompt).then(()=>toast('คัดลอก Prompt แล้ว')).catch(()=>toast('เบราว์เซอร์ไม่อนุญาตให้คัดลอก'));}if(act==='voice-preview'){const d=s.dialogue[0];if(!d){toast('เพิ่มประโยคก่อนทดลองเสียง');return;}if(!window.speechSynthesis){toast('เบราว์เซอร์นี้ไม่รองรับ speech synthesis');return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(d.pronunciation||d.text);u.lang='th-TH';u.rate=d.pace==='ช้า'?.82:d.pace==='เร็ว'?1.12:1;speechSynthesis.speak(u);}if(act==='approve-shot'){s.status='อนุมัติ';save();render();toast('อนุมัติช็อตแล้ว');}if(act==='review-shot'){s.status='รอตรวจ';save();render();}if(act==='draft-shot'){s.status='ร่าง';save();render();}if(act==='save-version')saveVersion();if(act==='new-project'){modal('สร้างโปรเจกต์ใหม่',`<label class="field">ชื่อโปรเจกต์<input id="new-project-name" value="โปรเจกต์ละครใหม่"></label><div class="actions-row"><button class="btn primary" data-act="confirm-new">สร้างโปรเจกต์</button></div>`);}if(act==='confirm-new'){const p=fresh();p.title=$('#new-project-name').value||p.title;state.projects.unshift(p);state.projectId=p.id;state.clipId=p.clips[0].id;state.shotId=p.clips[0].shots[0].id;state.tab='story';$('#modal-root').innerHTML='';save();render();}if(act==='restore'){const v=p.versions.find(x=>x.id===idv);if(v&&confirm('ย้อนกลับไปยังเวอร์ชันนี้?')){const restored=JSON.parse(JSON.stringify(v.snapshot));restored.id=p.id;restored.versions=p.versions;restored.updated=now();state.projects=state.projects.map(x=>x.id===p.id?restored:x);save();render();toast('ย้อนกลับเวอร์ชันแล้ว');}}if(act==='import'){modal('นำเข้าโปรเจกต์ JSON',`<label class="field">วาง JSON ที่ส่งออกไว้<textarea id="import-area" rows="9"></textarea></label><div class="actions-row"><button class="btn primary" data-act="confirm-import">นำเข้าโปรเจกต์</button></div>`);}if(act==='confirm-import'){try{const obj=JSON.parse($('#import-area').value);if(!obj.id||!obj.clips)throw Error();state.projects.unshift(obj);state.projectId=obj.id;state.clipId=obj.clips[0].id;state.shotId=obj.clips[0].shots[0].id;$('#modal-root').innerHTML='';save();render();toast('นำเข้าโปรเจกต์สำเร็จ');}catch{toast('JSON ไม่ถูกต้อง');}}if(act==='export-all'){download(JSON.stringify(state.projects,null,2),'ai-prompt-studio-all-projects.json');} }
function modal(t,body){$('#modal-root').innerHTML=`<div class="modal-bg"><div class="modal"><div class="modal-title"><h3>${t}</h3><button class="btn outline" data-act="close-modal">ปิด</button></div>${body}</div></div>`;}
function download(content,name){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type:'application/json'}));a.href=url;a.download=name;a.click();URL.revokeObjectURL(url);}
function exportOne(){download(JSON.stringify(project(),null,2),(project().title||'ai-drama').replace(/[^\p{L}\p{N}-]+/gu,'-')+'.json');}
function click(e){const t=e.target.closest('button');if(!t)return;if(t.dataset.tab){state.tab=t.dataset.tab;render();return;}if(t.dataset.act){if(t.dataset.act==='close-modal'){$('#modal-root').innerHTML='';return;}handleAction(t.dataset.act,t.dataset.id);return;}if(t.dataset.selectChar){state.charId=t.dataset.selectChar;render();return;}if(t.dataset.selectLoc){state.locId=t.dataset.selectLoc;render();return;}if(t.dataset.selectClip){state.clipId=t.dataset.selectClip;state.shotId=currentClip().shots[0].id;state.prompt='';render();return;}if(t.dataset.selectShot){state.shotId=t.dataset.selectShot;state.prompt='';render();return;}if(t.dataset.toggle){const a=project()[t.dataset.toggle];project()[t.dataset.toggle]=a.includes(t.dataset.value)?a.filter(x=>x!==t.dataset.value):[...a,t.dataset.value];save();render();return;}if(t.dataset.openProject){state.projectId=t.dataset.openProject;state.clipId=project().clips[0].id;state.shotId=currentClip().shots[0].id;state.tab='overview';render();return;}if(t.dataset.duplicate){const p=JSON.parse(JSON.stringify(state.projects.find(x=>x.id===t.dataset.duplicate)));p.id=`PRJ-${id().toUpperCase()}`;p.title+=' (สำเนา)';p.versions=[];state.projects.unshift(p);state.projectId=p.id;state.clipId=p.clips[0].id;state.shotId=currentClip().shots[0].id;save();render();return;}if(t.dataset.deleteProject){if(state.projects.length===1){toast('ต้องมีอย่างน้อยหนึ่งโปรเจกต์');return;}if(confirm('ลบโปรเจกต์นี้?')){state.projects=state.projects.filter(x=>x.id!==t.dataset.deleteProject);state.projectId=state.projects[0].id;state.clipId=project().clips[0].id;state.shotId=currentClip().shots[0].id;save();render();}return;}if(t.dataset.issue){const [cid,sid]=t.dataset.issue.split(' / ');const target=project().clips.find(x=>x.id===cid);if(target){state.clipId=cid;state.shotId=target.shots.find(x=>x.id===sid)?.id||target.shots[0].id;state.tab='director';render();}return;}}
document.addEventListener('click',click);$('#export-btn').addEventListener('click',exportOne);$('#version-btn').addEventListener('click',()=>saveVersion());
document.addEventListener('change',e=>{const t=e.target;if(t.matches('[data-character-shot]')){const s=currentShot(),cid=t.dataset.characterShot;if(t.checked){if(!s.characterIds.includes(cid))s.characterIds.push(cid);s.states[cid] ||= {wardrobe:'',position:'',facing:'',item:'',hand:'ไม่ถือ',eye:'คู่สนทนา',emotion:'ปกติ',knowledge:'',next:''};}else{s.characterIds=s.characterIds.filter(x=>x!==cid);delete s.states[cid];}save();render();}});
render();
</script>
</body></html>
